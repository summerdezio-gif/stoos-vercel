<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stoo's Cards</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="nav__mark">Stoo<span>'</span>s Cards</div>
  <div class="nav__links">
    <a href="index.html" class="nav__link active">Accueil</a>
    <a href="collection.html" class="nav__link">La Collection</a>
  </div>
</nav>

<section class="hero">
  <div>
    <div class="badge">Collection TCG fan-made</div>
    <h1 class="hero__title">Stoo's<br><span class="accent">Cards</span></h1>
    <p class="hero__lede">Une collection de cartes fan-made, imaginée et dessinée carte par carte. Découvre, vote, collectionne.</p>
    <a href="collection.html" class="btn-collection">Voir la collection →</a>

    <div class="stats">
      <div>
        <div class="stat__num">126</div>
        <div class="stat__label">Cartes</div>
      </div>
      <div>
        <div class="stat__num">2</div>
        <div class="stat__label">Extensions</div>
      </div>
      <div>
        <div class="stat__num">11</div>
        <div class="stat__label">Types</div>
      </div>
    </div>
  </div>

  <div class="showcase">
    <div class="preview-card preview-card--left">
      <img src="images/apercu-1.jpg" alt="Carte">
      <span class="preview-card__tag mono">140 PV</span>
    </div>
    <div class="preview-card preview-card--center">
      <img src="images/apercu-2.jpg" alt="Carte">
      <span class="preview-card__tag mono">TOP</span>
    </div>
    <div class="preview-card preview-card--right">
      <img src="images/apercu-3.jpg" alt="Carte">
      <span class="preview-card__tag mono">240 PV</span>
    </div>
  </div>
</section>

</body>
</html>
